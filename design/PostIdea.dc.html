<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedbox: post an idea</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div style="{{rootStyle}}; min-height: 820px; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <header style="background: var(--card); border-bottom: 1px solid var(--line)">
    <div style="max-width: 920px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px; flex-grow: 1">
        <div style="width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">L</div>
        <span style="font-weight: 600; font-size: 17px">Lumen</span>
        <span style="color: var(--muted)">Feedback and roadmap</span>
      </div>
      <span style="font-size: 13px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px">Signed in as visitor</span>
      <span style="color: var(--muted)">sam@mail.example</span>
    </div>
  </header>
  <main style="max-width: 920px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 20px">
    <a href="Main.dc.html" style="color: var(--muted)">&larr; All ideas</a>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.2">Post an idea</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <form style="flex: 1 1 440px; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="t1" style="font-weight: 600">Title</label>
          <input id="t1" type="text" value="{{title}}" onInput="{{onTitle}}" placeholder="A short name for your idea" style="background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; min-height: 44px; font-size: 16px">
          <span style="font-size: 13px; color: var(--muted)">Check the ideas on the right first. Voting on an existing idea helps it more than a duplicate.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="d1" style="font-weight: 600">Details</label>
          <textarea id="d1" rows="6" placeholder="What are you trying to do, and what gets in the way?" style="background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 15px; resize: vertical"></textarea>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
          <button type="button" style="background: var(--accent); color: #FFFFFF; border: none; border-radius: 10px; padding: 0 22px; min-height: 44px; font-size: 15px; font-weight: 600; cursor: pointer">Post idea</button>
          <a href="Main.dc.html" style="color: var(--muted); padding: 10px 6px">Cancel</a>
        </div>
      </form>
      <aside aria-label="Similar ideas" style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 16px">{{similarHeading}}</h2>
        <sc-for list="{{similar}}" as="s" hint-placeholder-count="3">
          <div style="background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: flex; gap: 14px; align-items: center">
            <div style="flex-shrink: 0; width: 52px; text-align: center; font-weight: 700; font-size: 17px">{{s.votes}}<div style="font-size: 11px; font-weight: 500; color: var(--muted)">votes</div></div>
            <div style="flex-grow: 1; min-width: 0">
              <div style="font-weight: 600">{{s.title}}</div>
              <span style="background: {{s.chipBg}}; color: {{s.chipFg}}; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px">{{s.status}}</span>
            </div>
            <a href="Main.dc.html" style="color: var(--accent); font-weight: 600; font-size: 14px; padding: 10px 4px">Vote</a>
          </div>
        </sc-for>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#4338CA"},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { title: 'Sync notes' };
  }
  renderVals() {
    const dark = !!this.props.dark;
    const accent = this.props.accent || '#4338CA';
    const th = dark
      ? { bg: '#0F1115', card: '#171A21', ink: '#ECEEF3', muted: '#A3ABBA', line: '#2A2F3A', accent: '#8B93FF',
          open: ['#2A2F3A', '#D5DAE5'], planned: ['#1B2B5C', '#C9D8FF'], building: ['#4A2F08', '#FFD9A0'], shipped: ['#12402B', '#B8EBD0'] }
      : { bg: '#F6F7F9', card: '#FFFFFF', ink: '#16181D', muted: '#5B6270', line: '#E3E5EA', accent: accent,
          open: ['#ECEEF2', '#3A4150'], planned: ['#E0EAFF', '#1E3A8A'], building: ['#FDEBC8', '#7A3E00'], shipped: ['#D8F3E3', '#0F5132'] };
    const rootStyle = '--bg:' + th.bg + ';--card:' + th.card + ';--ink:' + th.ink + ';--muted:' + th.muted + ';--line:' + th.line + ';--accent:' + th.accent;
    const pool = [
      { title: 'Sync between two laptops', votes: 73, status: 'Open', words: ['sync', 'laptop', 'notes', 'two'] },
      { title: 'Offline mode', votes: 132, status: 'Planned', words: ['offline', 'sync', 'connection', 'notes'] },
      { title: 'Share a note by link', votes: 49, status: 'Open', words: ['share', 'link', 'note', 'notes'] },
      { title: 'Export notes to Markdown', votes: 187, status: 'Building', words: ['export', 'markdown', 'notes', 'note'] },
      { title: 'Search inside attachments', votes: 58, status: 'Open', words: ['search', 'attachments', 'pdf', 'notes'] }
    ];
    const t = this.state.title.trim().toLowerCase();
    const parts = t.split(/\s+/).filter((w) => w.length > 2);
    const scored = pool
      .map((p) => ({ p, n: parts.filter((w) => p.words.some((k) => k.startsWith(w) || w.startsWith(k)) || p.title.toLowerCase().includes(w)).length }))
      .filter((x) => x.n > 0)
      .sort((a, b) => b.n - a.n || b.p.votes - a.p.votes)
      .slice(0, 3);
    const similar = scored.map((x) => ({ title: x.p.title, votes: x.p.votes, status: x.p.status, chipBg: th[x.p.status.toLowerCase()][0], chipFg: th[x.p.status.toLowerCase()][1] }));
    return {
      rootStyle, similar,
      title: this.state.title,
      onTitle: (e) => this.setState({ title: e.target.value }),
      similarHeading: similar.length ? 'Similar ideas already on the board' : (t ? 'No similar ideas yet' : 'Similar ideas appear as you type')
    };
  }
}
</script>
</body>
</html>
